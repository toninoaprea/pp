<!DOCTYPE html>
<html lang="it">
<head>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --blue:       #1e40af;
      --blue-dark:  #1e3a8a;
      --blue-light: #dbeafe;
      --green-bg:   #dcfce7;
      --green-bd:   #16a34a;
      --green-tx:   #14532d;
      --orange-bg:  #ffedd5;
      --orange-bd:  #ea580c;
      --orange-tx:  #7c2d12;
      --emerg-bg:   #fef9c3;
      --emerg-bd:   #ca8a04;
      --emerg-tx:   #713f12;
      --gray-50:    #f8fafc;
      --gray-100:   #f1f5f9;
      --gray-200:   #e2e8f0;
      --gray-400:   #94a3b8;
      --gray-500:   #64748b;
      --gray-700:   #334155;
      --gray-900:   #0f172a;
      --ochre:      #b45309;
      --red:        #dc2626;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--gray-100);
      min-height: 100vh;
      color: var(--gray-900);
      -webkit-tap-highlight-color: transparent;
    }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue) 100%);
      color: white;
      padding: 0 16px;
      height: 58px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 2px 12px rgba(30,64,175,0.4);
    }
    .logo-wrap {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .header-title { font-size: 17px; font-weight: 700; }
    .header-sub   { font-size: 11px; opacity: 0.7; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .user-badge {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white; padding: 5px 10px;
      border-radius: 20px; font-size: 12px; font-weight: 600;
      display: none; align-items: center; gap: 5px;
    }
    .user-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; }
    .header-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white; padding: 6px 13px;
      border-radius: 20px; cursor: pointer;
      font-size: 13px; font-weight: 600;
      transition: background 0.2s;
    }
    .header-btn:hover { background: rgba(255,255,255,0.25); }

    /* STATS */
    .stats-section {
      background: white;
      border-bottom: 1px solid var(--gray-200);
      padding: 14px 16px 16px;
    }
    .section-label {
      font-size: 10px; font-weight: 700;
      color: var(--gray-400); text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 10px;
    }
    .zone-stats-row {
      display: flex; gap: 8px;
      overflow-x: auto; padding-bottom: 2px;
      margin-bottom: 14px; scrollbar-width: none;
    }
    .zone-stats-row::-webkit-scrollbar { display: none; }
    .zone-stat-card {
      flex: 0 0 auto; min-width: 80px;
      background: var(--gray-50);
      border: 1.5px solid var(--gray-200);
      border-radius: 10px; padding: 8px 10px; text-align: center;
    }
    .zone-stat-card.active-card { border-color: var(--blue); background: var(--blue-light); }
    .zone-stat-card.inactive { opacity: 0.38; }
    .zsc-label { font-size: 10px; color: var(--gray-500); font-weight: 600; margin-bottom: 3px; }
    .zsc-pct   { font-size: 18px; font-weight: 800; color: var(--gray-900); line-height: 1; }
    .zsc-count { font-size: 10px; color: var(--gray-400); margin-top: 3px; }
    .total-card {
      background: var(--gray-50);
      border: 2px solid var(--gray-200);
      border-radius: 14px; padding: 12px 16px;
      display: flex; align-items: center; gap: 14px;
    }
    .total-left { text-align: center; flex-shrink: 0; }
    .total-lbl  { font-size: 10px; font-weight: 700; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.5px; }
    .total-pct  { font-size: 36px; font-weight: 900; line-height: 1; transition: color 0.4s; }
    .total-pct.clr-black { color: var(--gray-900); }
    .total-pct.clr-ochre { color: var(--ochre); }
    .total-pct.clr-red   { color: var(--red); }
    .total-cnt  { font-size: 11px; color: var(--gray-400); margin-top: 2px; }
    .total-right { flex: 1; }
    .prog-bg { background: var(--gray-200); border-radius: 99px; height: 10px; overflow: hidden; margin-bottom: 5px; }
    .prog-fill { height: 100%; border-radius: 99px; width: 0%; transition: width 0.6s ease, background 0.4s; }
    .prog-fill.clr-black { background: var(--gray-700); }
    .prog-fill.clr-ochre { background: var(--ochre); }
    .prog-fill.clr-red   { background: var(--red); }
    .prog-markers { display: flex; justify-content: space-between; }
    .prog-markers span { font-size: 9px; color: var(--gray-400); }

    /* ZONE SELECTOR */
    .zone-selector { padding: 14px 16px; }
    .zone-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .zone-btn {
      background: white; border: 2px solid var(--gray-200);
      border-radius: 16px; padding: 14px 8px;
      text-align: center; cursor: pointer;
      transition: all 0.18s;
    }
    .zone-btn:active { transform: scale(0.96); }
    .zone-btn.active {
      border-color: var(--blue); background: var(--blue);
      color: white; box-shadow: 0 4px 16px rgba(30,64,175,0.35);
    }
    .zone-btn.locked { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
    .zbtn-num   { font-size: 26px; font-weight: 900; line-height: 1; }
    .zbtn-label { font-size: 10px; margin-top: 3px; opacity: 0.7; font-weight: 600; }
    .zbtn-mini  { font-size: 10px; margin-top: 4px; opacity: 0.8; font-weight: 700; }

    /* ZONE VIEW */
    .zone-view { display: none; padding: 0 16px 24px; }
    .zone-view.open { display: block; }
    .zone-view-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 12px; padding-top: 4px;
    }
    .zvh-title { font-size: 17px; font-weight: 800; }
    .zvh-count {
      font-size: 12px; color: var(--gray-500);
      background: var(--gray-100);
      border: 1px solid var(--gray-200);
      padding: 4px 10px; border-radius: 20px; font-weight: 700;
    }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
    .leg-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--gray-500); font-weight: 600; }
    .leg-dot { width: 13px; height: 13px; border-radius: 4px; border: 2px solid; flex-shrink: 0; }
    .leg-dot.free     { background: var(--green-bg);  border-color: var(--green-bd); }
    .leg-dot.occupied { background: var(--orange-bg); border-color: var(--orange-bd); }
    .leg-dot.emerg    { background: var(--emerg-bg);  border-color: var(--emerg-bd); }
    .warehouse-map {
      background: white; border: 1.5px solid var(--gray-200);
      border-radius: 16px; padding: 14px 12px; overflow-x: auto;
    }
    .scaffold-block { margin-bottom: 14px; }
    .scaffold-block:last-child { margin-bottom: 0; }
    .scaffold-header {
      font-size: 10px; font-weight: 800;
      color: var(--gray-500); text-transform: uppercase;
      letter-spacing: 0.8px; margin-bottom: 6px;
      padding: 3px 0; border-bottom: 1px solid var(--gray-200);
    }
    .pallet-row { display: flex; flex-wrap: wrap; gap: 5px; padding: 4px 0; }
    .lv-label {
      font-size: 9px; color: var(--gray-400);
      font-weight: 700; margin: 5px 0 4px;
      text-transform: uppercase; letter-spacing: 0.6px;
    }
    .pp {
      width: 54px; height: 46px; border-radius: 9px; border: 2px solid;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-size: 9px; font-weight: 800; cursor: pointer;
      transition: transform 0.1s; user-select: none;
      line-height: 1.3; text-align: center;
    }
    .pp:active { transform: scale(0.91); }
    .pp.free     { background: var(--green-bg);  border-color: var(--green-bd);  color: var(--green-tx); }
    .pp.occupied { background: var(--orange-bg); border-color: var(--orange-bd); color: var(--orange-tx); box-shadow: 0 2px 6px rgba(234,88,12,0.2); }
    .pp.emerg    { background: var(--emerg-bg);  border-color: var(--emerg-bd);  color: var(--emerg-tx); }
    .pp.readonly { cursor: default; }
    .pp.readonly:active { transform: none; }
    .pp .pp-code  { font-size: 8px; font-weight: 900; white-space: pre; }
    .pp .pp-state { font-size: 10px; line-height: 1; }

    /* LOGIN MODAL */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(15,23,42,0.65);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      z-index: 500; padding: 20px;
    }
    .modal-overlay.hidden { display: none; }
    .modal { background: white; border-radius: 22px; padding: 30px 24px 24px; width: 100%; max-width: 340px; box-shadow: 0 24px 60px rgba(0,0,0,0.25); }
    .modal-icon  { font-size: 36px; text-align: center; margin-bottom: 10px; }
    .modal-title { font-size: 21px; font-weight: 900; text-align: center; }
    .modal-sub   { font-size: 13px; color: var(--gray-500); text-align: center; margin: 4px 0 22px; }
    .m-input { width: 100%; padding: 13px 14px; border: 2px solid var(--gray-200); border-radius: 11px; font-size: 15px; margin-bottom: 10px; outline: none; transition: border-color 0.2s; }
    .m-input:focus { border-color: var(--blue); }
    .m-btn { width: 100%; padding: 14px; background: var(--blue); color: white; border: none; border-radius: 11px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 4px; }
    .m-btn:hover { background: #1d4ed8; }
    .m-err { color: var(--red); font-size: 13px; text-align: center; margin-top: 10px; font-weight: 600; display: none; }
    .m-cancel { display: block; width: 100%; text-align: center; padding: 10px; background: none; border: none; color: var(--gray-400); font-size: 14px; cursor: pointer; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--gray-900); color: white;
      padding: 10px 20px; border-radius: 99px;
      font-size: 13px; font-weight: 600;
      z-index: 600; transition: transform 0.3s ease; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* LOADING */
    .loading-bar { height: 3px; background: linear-gradient(90deg, var(--blue), #60a5fa, var(--blue)); background-size: 200% 100%; animation: loadSlide 1.4s infinite; }
    @keyframes loadSlide { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  </style>
</head>

    id:   `${code}-${i+1}`,
    code: `${code}\n#${i+1}`

}

// ══════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════
let isLoggedIn  = false;
let activeZone  = null;
let allStates   = {};  // { 'z1': { 'B0100A01-1': 'occupied', ... } }
let emergStates = {};  // { 'z2': { 'Z2EMERG-1': 'occupied', ... } }

// ══════════════════════════════════════════════════
//  GENERA UI DINAMICA
// ══════════════════════════════════════════════════
function generateUI() {
  // Zone stat cards
  const statsRow = document.getElementById('zoneStatsRow');
  statsRow.innerHTML = '';
  for (const z of ZONES) {
    const d = document.createElement('div');
    d.className = 'zone-stat-card' + (z.active ? '' : ' inactive');
    d.id = 'zsc' + z.num;
    d.innerHTML = `
      <div class="zsc-label">${z.name}</div>
      <div class="zsc-pct"  id="zpct${z.num}">${z.active ? '0%' : '—'}</div>
      <div class="zsc-count" id="zcnt${z.num}">${z.active ? '0/'+z.total : 'n.d.'}</div>
    `;
    statsRow.appendChild(d);
  }

  // Zone buttons
  const grid = document.getElementById('zoneGrid');
  grid.innerHTML = '';
  for (const z of ZONES) {
    const btn = document.createElement('div');
    btn.className = 'zone-btn' + (z.active ? '' : ' locked');
    btn.id = 'zb' + z.num;
    if (z.active) btn.onclick = () => selectZone(z.num);
    btn.innerHTML = `
      <div class="zbtn-num">${z.num}</div>
      <div class="zbtn-label">${z.name}</div>
      ${z.active ? `<div class="zbtn-mini" id="zbmini${z.num}">0 / ${z.total}</div>` : ''}
    `;
    grid.appendChild(btn);
  }

  // Zone views
  const container = document.getElementById('zoneViewsContainer');
  container.innerHTML = '';
  for (const z of ZONES) {
    if (!z.active) continue;
    const hasEmerg = z.emergency.length > 0;
    const sec = document.createElement('section');
    sec.className = 'zone-view';
    sec.id = 'zoneView' + z.num;
    sec.innerHTML = `
      <div class="zone-view-header">
        <div class="zvh-title">📦 ${z.name}</div>
        <div class="zvh-count" id="zv${z.num}Count">0 / ${z.total} occupati</div>
      </div>
      <div class="legend">
        <div class="leg-item"><div class="leg-dot free"></div>Libero</div>
        <div class="leg-item"><div class="leg-dot occupied"></div>Occupato</div>
        ${hasEmerg ? '<div class="leg-item"><div class="leg-dot emerg"></div>Emergenza</div>' : ''}
      </div>
      <div class="warehouse-map" id="map${z.num}"></div>
    `;
    container.appendChild(sec);
  }
}

// ══════════════════════════════════════════════════
//  FIREBASE SYNC
// ══════════════════════════════════════════════════
function initSync() {
  let loaded = 0;
  const active = ZONES.filter(z => z.active);
  if (active.length === 0) { hideLoading(); return; }

  for (const z of active) {
    db.ref('magazzino/' + z.key).on('value', snap => {
      allStates[z.key] = snap.val() || {};
      updateStats();
      if (activeZone === z.num) renderZoneMap(z.num);
      if (++loaded >= active.length) hideLoading();
    });
    if (z.emergency.length > 0) {
      db.ref('magazzino/emerg/' + z.key).on('value', snap => {
        emergStates[z.key] = snap.val() || {};
        if (activeZone === z.num) renderZoneMap(z.num);
      });
    }
  }
}

function savePallet(zoneKey, id, state, isEmerg) {
  const path = isEmerg
    ? `magazzino/emerg/${zoneKey}/${id}`
    : `magazzino/${zoneKey}/${id}`;
  db.ref(path).set(state);
}

// ══════════════════════════════════════════════════
//  STATS
// ══════════════════════════════════════════════════
function getAllPos(zone) {
  const pos = [];
  for (const sc of zone.scaffolds)
    for (const lv of sc.levels)
      pos.push(...lv.positions);
  return pos;
}

function updateStats() {
  let grandTotal = 0, grandOcc = 0;

  for (const z of ZONES) {
    if (!z.active) continue;
    const states   = allStates[z.key] || {};
    const allPos   = getAllPos(z);
    const occ      = allPos.filter(p => states[p.id] === 'occupied').length;

    if (z.countOnly) {
      // Zona 6 scaffali — mostra conteggio grezzo, non incide sulla %
      const displayTotal = allPos.length;
      document.getElementById('zpct' + z.num).textContent = '📦';
      document.getElementById('zcnt' + z.num).textContent = occ + '/' + displayTotal + ' scaff.';
      const mini = document.getElementById('zbmini' + z.num);
      if (mini) mini.textContent = occ + ' / ' + displayTotal;
      const det = document.getElementById('zv' + z.num + 'Count');
      if (det) det.textContent = occ + ' / ' + displayTotal + ' occupati';
    } else {
      const pct = z.total > 0 ? Math.round(occ / z.total * 100) : 0;
      document.getElementById('zpct' + z.num).textContent = pct + '%';
      document.getElementById('zcnt' + z.num).textContent = occ + '/' + z.total;
      const mini = document.getElementById('zbmini' + z.num);
      if (mini) mini.textContent = occ + ' / ' + z.total;
      const det = document.getElementById('zv' + z.num + 'Count');
      if (det) det.textContent = occ + ' / ' + z.total + ' occupati';
      grandTotal += z.total;
      grandOcc   += occ;
    }
  }

  const pct = grandTotal > 0 ? Math.round(grandOcc / grandTotal * 100) : 0;
  const clr = pct <= 50 ? 'clr-black' : pct <= 75 ? 'clr-ochre' : 'clr-red';
  const tEl = document.getElementById('totalPct');
  tEl.textContent = pct + '%';
  tEl.className = 'total-pct ' + clr;
  document.getElementById('totalCnt').textContent = grandOcc + ' / ' + grandTotal + ' p.p.';
  const fill = document.getElementById('progFill');
  fill.style.width = pct + '%';
  fill.className = 'prog-fill ' + clr;
}

// ══════════════════════════════════════════════════
//  RENDER MAPPA ZONA
// ══════════════════════════════════════════════════
function renderZoneMap(zoneNum) {
  const zone = ZONES.find(z => z.num === zoneNum);
  const map  = document.getElementById('map' + zoneNum);
  if (!zone || !map) return;
  map.innerHTML = '';

  const states = allStates[zone.key] || {};

  // Scaffali normali
  for (const sc of zone.scaffolds) {
    const block = document.createElement('div');
    block.className = 'scaffold-block';

    const hdr = document.createElement('div');
    hdr.className = 'scaffold-header';
    hdr.textContent = sc.label;
    block.appendChild(hdr);

    for (const lv of sc.levels) {
      const lvLbl = document.createElement('div');
      lvLbl.className = 'lv-label';
      lvLbl.textContent = lv.lbl;
      block.appendChild(lvLbl);

      const row = document.createElement('div');
      row.className = 'pallet-row';
      for (const p of lv.positions) {
        row.appendChild(makeCell(p, states[p.id] || 'free', zone.key, false));
      }
      block.appendChild(row);
    }
    map.appendChild(block);
  }

  // Emergenza
  if (zone.emergency.length > 0) {
    const eStates = emergStates[zone.key] || {};
    const eOcc    = zone.emergency.filter(p => (eStates[p.id] || 'free') === 'occupied').length;

    const block = document.createElement('div');
    block.className = 'scaffold-block';
    block.style.marginTop = '6px';

    const hdr = document.createElement('div');
    hdr.className = 'scaffold-header';
    hdr.style.borderColor = 'var(--emerg-bd)';
    hdr.style.color = 'var(--emerg-tx)';
    hdr.id = 'emergHdr' + zoneNum;
    hdr.textContent = `⚠️ Posti Emergenza — ${eOcc} / ${zone.emergency.length} occupati`;
    block.appendChild(hdr);

    const row = document.createElement('div');
    row.className = 'pallet-row';
    for (const p of zone.emergency) {
      row.appendChild(makeCell(p, eStates[p.id] || 'free', zone.key, true));
    }
    block.appendChild(row);
    map.appendChild(block);
  }
}

function makeCell(p, state, zoneKey, isEmerg) {
  const displayState = isEmerg ? (state === 'occupied' ? 'occupied' : 'emerg') : state;
  const icon = displayState === 'occupied' ? '🟠' : displayState === 'emerg' ? '⚠️' : '🟢';

  const cell = document.createElement('div');
  cell.className = 'pp ' + displayState + (isLoggedIn ? '' : ' readonly');
  cell.id = 'pp_' + p.id;
  cell.innerHTML = `<span class="pp-state">${icon}</span><span class="pp-code">${p.code}</span>`;

  if (isLoggedIn) {
    cell.addEventListener('click', () => onPalletClick(p, zoneKey, isEmerg));
  }
  return cell;
}

function onPalletClick(p, zoneKey, isEmerg) {
  const stateObj = isEmerg ? (emergStates[zoneKey] || {}) : (allStates[zoneKey] || {});
  const current  = stateObj[p.id] || 'free';
  const next     = current === 'free' ? 'occupied' : 'free';

  // Optimistic update
  if (isEmerg) {
    if (!emergStates[zoneKey]) emergStates[zoneKey] = {};
    emergStates[zoneKey][p.id] = next;
  } else {
    if (!allStates[zoneKey]) allStates[zoneKey] = {};
    allStates[zoneKey][p.id] = next;
  }

  savePallet(zoneKey, p.id, next, isEmerg);

  // Aggiorna cella locale
  const cell = document.getElementById('pp_' + p.id);
  if (cell) {
    const displayState = isEmerg ? (next === 'occupied' ? 'occupied' : 'emerg') : next;
    const icon = displayState === 'occupied' ? '🟠' : displayState === 'emerg' ? '⚠️' : '🟢';
    cell.className = 'pp ' + displayState;
    cell.innerHTML = `<span class="pp-state">${icon}</span><span class="pp-code">${p.code}</span>`;
    cell.addEventListener('click', () => onPalletClick(p, zoneKey, isEmerg));
  }

  // Aggiorna contatore emergenza
  if (isEmerg) {
    const zone    = ZONES.find(z => z.key === zoneKey);
    const eStates = emergStates[zoneKey] || {};
    const eOcc    = zone.emergency.filter(ep => (eStates[ep.id] || 'free') === 'occupied').length;
    const hdr     = document.getElementById('emergHdr' + zone.num);
    if (hdr) hdr.textContent = `⚠️ Posti Emergenza — ${eOcc} / ${zone.emergency.length} occupati`;
  } else {
    updateStats();
  }

  showToast(next === 'occupied' ? '🟠 Posto segnato come OCCUPATO' : '🟢 Posto segnato come LIBERO');
}

// ══════════════════════════════════════════════════
//  ZONE SELECTOR
// ══════════════════════════════════════════════════
function selectZone(n) {
  if (activeZone === n) {
    activeZone = null;
    document.getElementById('zb'  + n)?.classList.remove('active');
    document.getElementById('zoneView' + n)?.classList.remove('open');
    document.getElementById('zsc' + n)?.classList.remove('active-card');
    return;
  }
  if (activeZone) {
    document.getElementById('zb'  + activeZone)?.classList.remove('active');
    document.getElementById('zoneView' + activeZone)?.classList.remove('open');
    document.getElementById('zsc' + activeZone)?.classList.remove('active-card');
  }
  activeZone = n;
  document.getElementById('zb'  + n)?.classList.add('active');
  document.getElementById('zsc' + n)?.classList.add('active-card');
  const view = document.getElementById('zoneView' + n);
  if (view) {
    view.classList.add('open');
    renderZoneMap(n);
    setTimeout(() => view.scrollIntoView({ behavior:'smooth', block:'start' }), 80);
  }
}

// ══════════════════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════════════════
function openLogin() {
  document.getElementById('loginModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('mUser').focus(), 100);
}
function closeLogin() {
  document.getElementById('loginModal').classList.add('hidden');
  document.getElementById('mErr').style.display = 'none';
  document.getElementById('mUser').value = '';
  document.getElementById('mPass').value = '';
}
function doLogin() {
  const u = document.getElementById('mUser').value.trim();
  const p = document.getElementById('mPass').value;
  if (u === CREDS.user && p === CREDS.pass) {
    isLoggedIn = true;
    closeLogin();
    document.getElementById('loginBtn').style.display  = 'none';
    document.getElementById('logoutBtn').style.display = 'flex';
    document.getElementById('userBadge').style.display = 'flex';
    if (activeZone) renderZoneMap(activeZone);
    showToast('✅ Accesso effettuato — Logistica');
  } else {
    document.getElementById('mErr').style.display = 'block';
    document.getElementById('mPass').value = '';
    document.getElementById('mPass').focus();
  }
}
function doLogout() {
  isLoggedIn = false;
  document.getElementById('loginBtn').style.display  = 'flex';
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('userBadge').style.display = 'none';
  if (activeZone) renderZoneMap(activeZone);
  showToast('👋 Uscita effettuata');
}

// ══════════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
function hideLoading() {
  document.getElementById('loadingBar').style.display = 'none';
}
